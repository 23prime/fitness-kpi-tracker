---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json

version: '0.2'

enableGlobDot: true

ignoreRegExpList:
  - '0x[0-9a-fA-F]+L?'

dictionaryDefinitions:
  - name: base-dict
    path: './.cspell/dicts/base.txt'
    addWords: true

  - name: project-dict
    path: './.cspell/dicts/project.txt'
    addWords: true

dictionaries:
  - base-dict
  - project-dict

overrides:
  # mise file tasks have no file extension, so cspell cannot infer the language
  # and skips the shell dictionary without this.
  - filename: 'mise-tasks/**'
    languageId: shellscript

ignorePaths:
  - '.git'
  - '.vscode'
  - 'node_modules'
  - 'gradlew'
  - 'gradlew.bat'
  - 'gradle/wrapper'
