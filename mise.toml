# ================================================================
# Settings
# ================================================================
[settings]
auto_install = false
minimum_release_age = "3d"


# ================================================================
# Plugins
# ================================================================
[plugins]
android-sdk = "https://github.com/mise-plugins/vfox-android-sdk#d94bb261a232fdf7b8f46913cacc776ab293f94f"


# ================================================================
# Tools
# ================================================================
[tools]

# Node.js
node = "26"

# Android
java = "temurin-21"
android-sdk = "22.0"

# Markdown
markdownlint-cli2 = "0.23.1"

# GitHub Actions
actionlint = "1"
shellcheck = "0.11"
zizmor = "1.28.0"

# Git
lefthook = "2.1.10"
betterleaks = "v1.6.1"

# Spell Check
cspell = "10"


# ================================================================
# Tasks
# See: https://mise.jdx.dev/tasks/toml-tasks.html
# ================================================================

# Global
[tasks.setup]
description = "Setup tools"
env = { GITHUB_TOKEN = "{{ exec(command='gh auth token') }}" }
run = ["mise trust -yq", "mise install", "lefthook install", { task = "android-sdk-licenses" }]
alias = "s"

# Android SDK
[tasks.android-sdk-licenses]
description = "Accept Android SDK licenses"
run = "yes | sdkmanager --licenses"

[tasks.fix]
description = "Fix all issues"
depends = ["md-fix", "gh-fix", "android-fix"]
alias = "f"

[tasks.check]
description = "Check for all issues (lightweight; used by pre-commit)"
depends = ["md-check", "gh-check", "spell-check", "secret-check-all", "android-check"]
alias = "c"

[tasks.check-full]
description = "Check for all issues, including full Android build/test/lint (used by pre-push/CI)"
run = [{ task = "check" }, { task = "android-check-full" }]
alias = "cf"

[tasks.fix-and-check]
run = [{ task = "fix" }, { task = "check" }]
description = "Fix all issues and check for issues"
alias = "fc"

# Markdown
[tasks.md-fix]
description = "Fix Markdown issues"
run = "markdownlint-cli2 '**/*.md' --fix"
alias = "mf"

[tasks.md-check]
description = "Check for Markdown issues"
run = "markdownlint-cli2 '**/*.md'"
alias = "mc"

# GitHub Actions
[tasks.gh-fix]
description = "Fix GitHub Actions workflows"
run = "zizmor --fix=all ."
alias = "ghf"

[tasks.gh-check]
description = "Check GitHub Actions workflows"
run = [
  "actionlint .github/workflows/*.yml",
  "zizmor . --persona=pedantic --min-severity=low",
]
alias = "ghc"

# Spell Check
[tasks.spell-check]
description = "Check spelling"
run = "cspell . --gitignore --verbose"
alias = "sc"

# Secrets
[tasks.secret-check]
description = "Check staged files for leaked secrets"
run = "betterleaks git --pre-commit --redact --no-banner"
alias = "scc"

[tasks.secret-check-all]
description = "Check for leaked secrets"
run = "betterleaks git --redact --no-banner"
alias = "sca"

# Android
[tasks.android-fix]
description = "Fix Kotlin formatting issues"
run = "./gradlew ktlintFormat"
alias = "af"

[tasks.android-check]
description = "Check Kotlin formatting and static analysis (ktlint, detekt)"
run = "./gradlew ktlintCheck detekt"
alias = "ac"

[tasks.android-check-full]
description = "Build, test, and lint the Android app"
run = "./gradlew assembleDebug test lintDebug"
alias = "acf"

# mise lock
[tasks.lock-fix]
description = "Update mise.lock"
run = "mise lock"
alias = "lf"

[tasks.lock-check]
description = "Check mise.lock is up to date"
run = ["mise lock", "git diff --exit-code -- mise.lock"]
alias = "lc"
